name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Unzip project source
        run: |
          if [ ! -f source.zip ]; then
            echo "::error::source.zip not found at the repo root."
            exit 1
          fi
          unzip -o source.zip -d .
          ls -la CineFree

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        working-directory: CineFree
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CineFree-debug-apk
          path: CineFree/app/build/outputs/apk/debug/*.apk
